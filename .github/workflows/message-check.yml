name: Message check

# Enforces the message rules in AI_RULES.md section 7 (see .github/scripts/message-check.js).
# Pull requests and pushes fail on tool-named branches and on commits with signature lines,
# tool names or a tool identity. Signature footers in PR descriptions, issues, comments and
# reviews are removed automatically. Edits made here use GITHUB_TOKEN and do not start new runs.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]
  push:
    branches: ['**']
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created, edited]
  pull_request_review:
    types: [submitted, edited]
  pull_request_review_comment:
    types: [created, edited]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check messages
        run: node .github/scripts/message-check.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
